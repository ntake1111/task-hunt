<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Hunt</title>
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent: #ff4757;
      --text: #ffffff;
      --sub-text: #d0d0e0;
      --border-7days: #2ed573;
      --border-3days: #ffa502;
      --border-1day: #ff4757;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body.theme-silver { --accent: #70a1ff; }
    body.theme-gold { --accent: #eccc68; }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text);
      font-family: var(--font-family);
      padding-bottom: 70px;
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
    }

    header {
      background: #18181c;
      padding: 12px 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
      border-bottom: 1px solid #3d3d48;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .view-switcher {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 10px;
      background: #18181c;
    }

    .tab-btn {
      background: #2d2d35;
      color: var(--sub-text);
      border: 1px solid #444;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .container { padding: 15px; }

    .task-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      border-left: 6px solid var(--border-7days);
      position: relative;
      border-top: 1px solid #2d2d35;
      border-right: 1px solid #2d2d35;
      border-bottom: 1px solid #2d2d35;
    }
    .task-card.day-3 { border-left-color: var(--border-3days); }
    .task-card.day-1 { border-left-color: var(--border-1day); }
    .task-card.expired { border-left-color: #747d8c; opacity: 0.9; }

    .expired-badge {
      background: #ff4757;
      color: white;
      font-size: 0.8rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 5px;
    }

    .repeat-badge {
      background: #70a1ff;
      color: white;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      margin-left: 5px;
    }

    .task-title { font-size: 1.15rem; font-weight: bold; margin-bottom: 6px; color: #ffffff; }
    .task-meta { font-size: 0.9rem; color: var(--sub-text); margin-bottom: 8px; }

    .hp-bar-bg {
      background: #2d2d35;
      height: 14px;
      border-radius: 7px;
      overflow: hidden;
      margin-top: 6px;
      border: 1px solid #444;
    }
    .hp-bar-fill {
      background: var(--accent);
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
      text-align: center;
    }
    .cal-day-head { font-weight: bold; color: #ffffff; padding: 5px 0; font-size: 0.85rem; }
    .cal-cell {
      background: var(--card-bg);
      min-height: 60px;
      border-radius: 6px;
      padding: 4px;
      font-size: 0.8rem;
      border: 1px solid #2d2d35;
    }
    .cal-date { font-weight: bold; color: #ffffff; margin-bottom: 2px; }
    .cal-task-dot {
      background: var(--accent);
      color: white;
      border-radius: 3px;
      padding: 2px 4px;
      margin-top: 2px;
      font-size: 0.7rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .battle-screen { text-align: center; }
    .monster-avatar { font-size: 4.5rem; margin: 15px 0; animation: bounce 2s infinite; }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
    .action-btn {
      background: #2d2d35;
      color: #fff;
      border: 1px solid #555;
      padding: 10px 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .action-btn:active { background: var(--accent); }

    .timer-box {
      background: #18181c;
      padding: 15px;
      border-radius: 12px;
      margin: 15px 0;
      border: 1px solid #3d3d48;
    }
    .timer-display { font-size: 2.5rem; font-weight: bold; font-family: monospace; margin: 8px 0; color: #ffffff; }

    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 600px;
      background: #18181c;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #3d3d48;
    }
    .nav-item {
      color: var(--sub-text);
      background: none;
      border: none;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }
    .nav-item.active { color: var(--accent); font-weight: bold; }
    .nav-icon { font-size: 1.3rem; }

    .modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: 12px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #444;
    }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.9rem; color: var(--sub-text); margin-bottom: 5px; font-weight: bold; }
    .form-control {
      width: 100%;
      padding: 10px;
      background: #121214;
      border: 1px solid #444;
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <span>Task Hunt ⚔️</span>
    <button id="notify-btn" class="action-btn" style="font-size:0.75rem; padding:4px 8px;" onclick="requestNotificationPermission()">🔔 通知許可</button>
    <span id="rank-badge" style="font-size:0.8rem; background:#2d2d35; color:#fff; padding:4px 8px; border-radius:12px; border:1px solid #444;">ランク: ブロンズ</span>
  </header>

  <div id="view-switcher" class="view-switcher">
    <button class="tab-btn active" onclick="switchView('week')">週間表示</button>
    <button class="tab-btn" onclick="switchView('month')">月間カレンダー</button>
  </div>

  <div class="container">
    <div id="screen-week">
      <div id="task-list-week"></div>
    </div>

    <div id="screen-month" class="hidden">
      <div id="calendar-container"></div>
    </div>

    <div id="screen-detail" class="hidden battle-screen">
      <button class="action-btn" style="float:left;" onclick="showScreen('start')">← 戻る</button>
      <div style="clear:both;"></div>
      <div class="monster-avatar" id="detail-monster-icon">👾</div>
      <h2 id="detail-task-title" style="word-break: break-all;">タスク名</h2>
      <p id="detail-meta" style="color:var(--sub-text); font-size:0.9rem; margin:6px 0;"></p>

      <div style="margin: 15px 0;">
        <div style="display:flex; justify-content:space-between; font-size:1rem; font-weight:bold;">
          <span>HP</span>
          <span id="detail-hp-text">100 / 100 分</span>
        </div>
        <div class="hp-bar-bg"><div id="detail-hp-fill" class="hp-bar-fill"></div></div>
      </div>

      <div style="background:#18181c; padding:12px; border-radius:8px; text-align:left; font-size:0.95rem; margin-bottom:15px; border:1px solid #3d3d48;">
        <p>🎁 <strong style="color:#fff;">成功時報酬:</strong> <span id="detail-reward" style="color:var(--sub-text);">-</span></p>
        <p style="margin-top:6px;">⚡ <strong style="color:#fff;">失敗時罰則:</strong> <span id="detail-penalty" style="color:var(--sub-text);">-</span></p>
      </div>

      <div class="timer-box">
        <div style="font-size:0.9rem; color:var(--sub-text);">ポモドーロタイマー (1時間作業で自動ダメージ)</div>
        <div class="timer-display" id="timer-display">60:00</div>
        <div style="display:flex; gap:10px; justify-content:center;">
          <button class="action-btn" id="timer-btn" onclick="toggleTimer()" style="background:var(--accent); border-color:var(--accent);">タイマー開始</button>
          <button class="action-btn" onclick="resetTimer()">リセット</button>
        </div>
      </div>

      <div style="font-size:0.9rem; color:var(--sub-text);">手動ダメージ入力</div>
      <div class="btn-group">
        <button class="action-btn" onclick="applyDamage(15)">+15分</button>
        <button class="action-btn" onclick="applyDamage(30)">+30分</button>
        <button class="action-btn" onclick="applyDamage(60)">+60分</button>
        <button class="action-btn" onclick="undoDamage()" style="color:#ffa502; border-color:#ffa502;">取り消し</button>
      </div>
    </div>

    <div id="screen-history" class="hidden">
      <h3>討伐履歴 & ランク</h3>
      <p style="font-size:0.95rem; color:var(--sub-text); margin: 8px 0;">完了数: <span id="history-count" style="color:#fff; font-weight:bold;">0</span>体</p>
      <div id="history-list"></div>
    </div>

    <div id="screen-settings" class="hidden">
      <h3>設定</h3>
      <div class="form-group" style="margin-top:15px;">
        <label>テーマカラー（ランクに応じて解放）</label>
        <select id="theme-select" class="form-control" onchange="changeTheme(this.value)">
          <option value="default">ブロンズ（標準ダーク）</option>
          <option value="silver" id="opt-silver" disabled>シルバー（100体撃破）</option>
          <option value="gold" id="opt-gold" disabled>ゴールド（200体撃破）</option>
        </select>
      </div>
      <button class="action-btn" onclick="clearAllData()" style="background:#ff4757; width:100%; margin-top:20px; border-color:#ff4757;">全データをリセット</button>
    </div>
  </div>

  <!-- 新規作成モーダル -->
  <div id="modal-create" class="modal hidden">
    <div class="modal-content">
      <h3 style="margin-bottom:15px; color:#fff;">新規タスク（敵）登録</h3>
      <div class="form-group">
        <label>タスク名（50文字以内）</label>
        <input type="text" id="form-title" class="form-control" placeholder="例: レポート作成" maxlength="50">
      </div>
      <div class="form-group">
        <label>締め切り日時</label>
        <input type="datetime-local" id="form-deadline" class="form-control">
      </div>
      <div class="form-group">
        <label>繰り返し設定</label>
        <select id="form-repeat" class="form-control">
          <option value="none">繰り返しなし</option>
          <option value="daily">毎日復活（デイリー）</option>
          <option value="weekly">毎週復活（ウィークリー）</option>
        </select>
      </div>
      <div class="form-group">
        <label>タスクの重さ（作業時間・分）＝ 敵のHP</label>
        <input type="number" id="form-hp" class="form-control" placeholder="180 (3時間の場合)" min="1">
      </div>
      <div class="form-group">
        <label>敵の見た目</label>
        <select id="form-monster" class="form-control">
          <option value="👾">👾 スライム級</option>
          <option value="👺">👺 天狗（中型）</option>
          <option value="🐉">🐉 ドラゴン（大型ボス）</option>
        </select>
      </div>
      <div class="form-group">
        <label>成功時のご褒美（任意）</label>
        <input type="text" id="form-reward" class="form-control" placeholder="例: 好きなパフェを食べる">
      </div>
      <div class="form-group">
        <label>失敗時のペナルティ（任意）</label>
        <input type="text" id="form-penalty" class="form-control" placeholder="例: 部屋の掃除をする">
      </div>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button class="action-btn" style="flex:1;" onclick="closeModal('modal-create')">キャンセル</button>
        <button class="action-btn" style="flex:1; background:var(--accent); border-color:var(--accent);" onclick="saveTask()">登録</button>
      </div>
    </div>
  </div>

  <div id="modal-expired" class="modal hidden">
    <div class="modal-content" style="text-align:center;">
      <div style="font-size:3.5rem;">⚠️</div>
      <h3 style="color:#ff4757; margin:10px 0;">討伐失敗...</h3>
      <p style="font-size:0.95rem; margin-bottom:10px; color:#fff;">期限が切れ、敵に逃げられてしまいました！</p>
      <div id="expired-penalty-container" style="background:#18181c; padding:12px; border-radius:8px; font-size:0.95rem; margin-bottom:15px; text-align:left; border:1px solid #3d3d48;">
        <strong style="color:#fff;">罰則:</strong> <span id="expired-penalty-text" style="color:var(--sub-text);"></span>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px;">
        <button class="action-btn" style="background:var(--accent); border-color:var(--accent);" onclick="retryTask()">再追撃する (HP+15分ペナルティ)</button>
        <button class="action-btn" onclick="deleteExpiredTask()">諦める (記憶から消す)</button>
      </div>
    </div>
  </div>

  <nav class="nav-bar">
    <button class="nav-item active" onclick="showScreen('start')">
      <span class="nav-icon">⚔️</span>討伐一覧
    </button>
    <button class="nav-item" onclick="openCreateModal()">
      <span class="nav-icon">➕</span>新規作成
    </button>
    <button class="nav-item" onclick="showScreen('history')">
      <span class="nav-icon">📜</span>履歴
    </button>
    <button class="nav-item" onclick="showScreen('settings')">
      <span class="nav-icon">⚙️</span>設定
    </button>
  </nav>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks_rpg')) || [];
    let historyTasks = JSON.parse(localStorage.getItem('history_rpg')) || [];
    let notifiedTasks = JSON.parse(localStorage.getItem('notified_rpg')) || [];
    let currentTaskId = null;
    let timerInterval = null;
    let timerSeconds = 60 * 60;
    let isTimerRunning = false;
    let lastDamage = 0;
    let calDisplayDate = new Date();

    window.onload = () => {
      renderTasks();
      updateRank();
      checkNotifications();
    };

    function saveData() {
      localStorage.setItem('tasks_rpg', JSON.stringify(tasks));
      localStorage.setItem('history_rpg', JSON.stringify(historyTasks));
      localStorage.setItem('notified_rpg', JSON.stringify(notifiedTasks));
    }

    // 通知許可の要求
    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            alert('通知が許可されました！締切1日前にリマインドされます。');
            document.getElementById('notify-btn').style.display = 'none';
            checkNotifications();
          }
        });
      } else {
        alert('お使いのブラウザは通知に対応していません。');
      }
    }

    // 締切1日前の通知チェック
    function checkNotifications() {
      if ('Notification' in window && Notification.permission === 'granted') {
        document.getElementById('notify-btn').style.display = 'none';
        const now = new Date();
        tasks.forEach(task => {
          const deadline = new Date(task.deadline);
          const diffHours = (deadline - now) / (1000 * 60 * 60);

          // 24時間以内かつ未通知の場合に通知発火
          if (diffHours > 0 && diffHours <= 24 && !notifiedTasks.includes(task.id)) {
            new Notification(' Task Hunt 襲来警告！', {
              body: `「${task.title}」の討伐締切まであと1日（24時間以内）です！`,
              icon: './icon.png'
            });
            notifiedTasks.push(task.id);
            saveData();
          }
        });
      }
    }

    function showScreen(screen) {
      document.querySelectorAll('.container > div').forEach(div => div.classList.add('hidden'));
      document.getElementById('view-switcher').classList.add('hidden');
      
      if (screen === 'start') {
        document.getElementById('view-switcher').classList.remove('hidden');
        document.getElementById('screen-week').classList.remove('hidden');
        renderTasks();
      } else if (screen === 'history') {
        document.getElementById('screen-history').classList.remove('hidden');
        renderHistory();
      } else if (screen === 'settings') {
        document.getElementById('screen-settings').classList.remove('hidden');
      } else if (screen === 'detail') {
        document.getElementById('screen-detail').classList.remove('hidden');
      }
    }

    function switchView(type) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (type === 'week') {
        event.target.classList.add('active');
        document.getElementById('screen-week').classList.remove('hidden');
        document.getElementById('screen-month').classList.add('hidden');
      } else {
        event.target.classList.add('active');
        document.getElementById('screen-week').classList.add('hidden');
        document.getElementById('screen-month').classList.remove('hidden');
        renderCalendar();
      }
    }

    function openCreateModal() {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('form-deadline').min = now.toISOString().slice(0, 16);
      openModal('modal-create');
    }

    function renderTasks() {
      const container = document.getElementById('task-list-week');
      container.innerHTML = '';

      if (tasks.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--sub-text); margin-top:30px; font-weight:bold;">現在、討伐対象の敵（タスク）はいません！</p>';
        return;
      }

      const now = new Date();

      tasks.forEach(task => {
        const deadline = new Date(task.deadline);
        const diffDays = (deadline - now) / (1000 * 60 * 60 * 24);
        
        let borderClass = '';
        let isExpired = false;

        if (task.currentHp > 0 && diffDays < 0) {
          isExpired = true;
          borderClass = 'expired';
        } else if (diffDays <= 1) {
          borderClass = 'day-1';
        } else if (diffDays <= 3) {
          borderClass = 'day-3';
        }

        const hpPercent = Math.max(0, (task.currentHp / task.maxHp) * 100);

        let repeatLabel = '';
        if (task.repeat === 'daily') repeatLabel = '<span class="repeat-badge">毎日</span>';
        if (task.repeat === 'weekly') repeatLabel = '<span class="repeat-badge">毎週</span>';

        const card = document.createElement('div');
        card.className = `task-card ${borderClass}`;
        card.onclick = () => {
          if (isExpired) openExpiredModal(task.id);
          else openDetail(task.id);
        };

        card.innerHTML = `
          ${isExpired ? '<span class="expired-badge">⚠️ 逃亡 / 期限切れ</span>' : ''}
          <div class="task-title">${task.monster} ${escapeHtml(task.title)} ${repeatLabel}</div>
          <div class="task-meta">締切: ${new Date(task.deadline).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</div>
          <div style="font-size:0.85rem; color:var(--sub-text); font-weight:bold;">残りHP: ${task.currentHp} / ${task.maxHp} 分</div>
          <div class="hp-bar-bg"><div class="hp-bar-fill" style="width: ${hpPercent}%;"></div></div>
        `;
        container.appendChild(card);
      });
    }

    function renderCalendar() {
      const container = document.getElementById('calendar-container');
      const year = calDisplayDate.getFullYear();
      const month = calDisplayDate.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <button class="action-btn" onclick="changeMonth(-1)">＜ 前</button>
          <h4 style="color:#fff; font-size:1.1rem; margin:0;">${year}年 ${month + 1}月</h4>
          <button class="action-btn" onclick="changeMonth(1)">次 ＞</button>
        </div>
      `;
      html += '<div class="calendar-grid">';
      ['日','月','火','水','木','金','土'].forEach(d => html += `<div class="cal-day-head">${d}</div>`);

      for (let i = 0; i < firstDay; i++) html += '<div></div>';

      for (let day = 1; day <= daysInMonth; day++) {
        const currentDateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
        const dayTasks = tasks.filter(t => t.deadline.startsWith(currentDateStr));

        html += `<div class="cal-cell"><div class="cal-date">${day}</div>`;
        dayTasks.forEach(t => {
          html += `<div class="cal-task-dot">${t.monster}${escapeHtml(t.title)}</div>`;
        });
        html += '</div>';
      }
      html += '</div>';
      container.innerHTML = html;
    }

    function changeMonth(delta) {
      calDisplayDate.setMonth(calDisplayDate.getMonth() + delta);
      renderCalendar();
    }

    function saveTask() {
      const title = document.getElementById('form-title').value.trim();
      const deadline = document.getElementById('form-deadline').value;
      const repeat = document.getElementById('form-repeat').value;
      const hp = parseInt(document.getElementById('form-hp').value);
      const monster = document.getElementById('form-monster').value;
      const reward = document.getElementById('form-reward').value.trim();
      const penalty = document.getElementById('form-penalty').value.trim();

      if (!title) { alert('タスク名を入力してください'); return; }
      if (title.length > 50) { alert('タスク名は50文字以内で入力してください'); return; }
      if (!deadline) { alert('締め切り日時を設定してください'); return; }
      if (new Date(deadline) <= new Date()) { alert('締め切り日時には未来の日時を指定してください'); return; }
      if (isNaN(hp) || hp <= 0) { alert('タスクの重さ（HP）は1分以上の数値を指定してください'); return; }

      tasks.push({
        id: Date.now(),
        title, deadline, repeat, maxHp: hp, currentHp: hp, monster, reward, penalty
      });

      saveData();
      closeModal('modal-create');
      document.getElementById('form-title').value = '';
      document.getElementById('form-deadline').value = '';
      document.getElementById('form-hp').value = '';
      document.getElementById('form-reward').value = '';
      document.getElementById('form-penalty').value = '';
      renderTasks();
      checkNotifications();
    }

    function openDetail(id) {
      currentTaskId = id;
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      document.getElementById('detail-monster-icon').innerText = task.monster;
      document.getElementById('detail-task-title').innerText = task.title;
      document.getElementById('detail-reward').innerText = task.reward || 'なし';
      document.getElementById('detail-penalty').innerText = task.penalty || 'なし';
      updateDetailHp();
      showScreen('detail');
    }

    function updateDetailHp() {
      const task = tasks.find(t => t.id === currentTaskId);
      if (!task) return;
      document.getElementById('detail-hp-text').innerText = `${task.currentHp} / ${task.maxHp} 分`;
      const percent = Math.max(0, (task.currentHp / task.maxHp) * 100);
      document.getElementById('detail-hp-fill').style.width = `${percent}%`;

      // 討伐完了時の処理（繰り返しタスクの自動復活含む）
      if (task.currentHp <= 0) {
        setTimeout(() => {
          let msg = `🎉 討伐成功！\nおめでとうございます！`;
          if (task.reward) msg += `\n【ご褒美】${task.reward} を獲得しました！`;
          alert(msg);

          historyTasks.push({...task, completedAt: new Date().toISOString()});

          // 繰り返しタスクの自動再生成
          if (task.repeat === 'daily' || task.repeat === 'weekly') {
            const nextDeadline = new Date(task.deadline);
            if (task.repeat === 'daily') nextDeadline.setDate(nextDeadline.getDate() + 1);
            if (task.repeat === 'weekly') nextDeadline.setDate(nextDeadline.getDate() + 7);

            tasks.push({
              ...task,
              id: Date.now(),
              deadline: nextDeadline.toISOString().slice(0, 16),
              currentHp: task.maxHp
            });
          }

          tasks = tasks.filter(t => t.id !== currentTaskId);
          saveData();
          updateRank();
          showScreen('start');
        }, 100);
      }
    }

    function applyDamage(amount) {
      const task = tasks.find(t => t.id === currentTaskId);
      if (task) {
        lastDamage = amount;
        task.currentHp = Math.max(0, task.currentHp - amount);
        saveData();
        updateDetailHp();
      }
    }

    function undoDamage() {
      const task = tasks.find(t => t.id === currentTaskId);
      if (task && lastDamage > 0) {
        task.currentHp = Math.min(task.maxHp, task.currentHp + lastDamage);
        lastDamage = 0;
        saveData();
        updateDetailHp();
      }
    }

    function toggleTimer() {
      const btn = document.getElementById('timer-btn');
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        btn.innerText = 'タイマー再開';
      } else {
        isTimerRunning = true;
        btn.innerText = '一時停止';
        timerInterval = setInterval(() => {
          timerSeconds--;
          const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
          const s = String(timerSeconds % 60).padStart(2, '0');
          document.getElementById('timer-display').innerText = `${m}:${s}`;

          if (timerSeconds <= 0) {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerSeconds = 60 * 60;
            document.getElementById('timer-display').innerText = "60:00";
            btn.innerText = 'タイマー開始';
            applyDamage(60);
            alert("⏰ 1時間集中達成！敵に60ダメージ与えました！");
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isTimerRunning = false;
      timerSeconds = 60 * 60;
      document.getElementById('timer-display').innerText = "60:00";
      document.getElementById('timer-btn').innerText = 'タイマー開始';
    }

    function openExpiredModal(id) {
      currentTaskId = id;
      const task = tasks.find(t => t.id === id);
      const container = document.getElementById('expired-penalty-container');
      
      if (task.penalty) {
        container.classList.remove('hidden');
        document.getElementById('expired-penalty-text').innerText = task.penalty;
      } else {
        container.classList.add('hidden');
      }
      openModal('modal-expired');
    }

    function retryTask() {
      const task = tasks.find(t => t.id === currentTaskId);
      if (task) {
        task.currentHp += 15;
        task.maxHp += 15;
        const newDate = new Date();
        newDate.setDate(newDate.getDate() + 1);
        task.deadline = newDate.toISOString().slice(0, 16);
        saveData();
        closeModal('modal-expired');
        renderTasks();
      }
    }

    function deleteExpiredTask() {
      tasks = tasks.filter(t => t.id !== currentTaskId);
      saveData();
      closeModal('modal-expired');
      renderTasks();
    }

    function updateRank() {
      const count = historyTasks.length;
      let rank = 'ブロンズ';
      if (count >= 300) rank = 'ダイヤ';
      else if (count >= 200) rank = 'ゴールド';
      else if (count >= 100) rank = 'シルバー';

      document.getElementById('rank-badge').innerText = `ランク: ${rank}`;
      document.getElementById('history-count').innerText = count;

      if (count >= 100) document.getElementById('opt-silver').disabled = false;
      if (count >= 200) document.getElementById('opt-gold').disabled = false;
    }

    function renderHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = historyTasks.map(t => `
        <div style="background:var(--card-bg); padding:12px; border-radius:8px; margin-bottom:8px; font-size:0.9rem; border:1px solid #3d3d48;">
          <div>⚔️ <strong>${t.monster} ${escapeHtml(t.title)}</strong> (討伐完了)</div>
          <div style="color:var(--sub-text); font-size:0.8rem; margin-top:4px;">${new Date(t.completedAt).toLocaleDateString('ja-JP')}</div>
        </div>
      `).join('');
    }

    function changeTheme(theme) {
      document.body.className = '';
      if (theme !== 'default') document.body.classList.add(`theme-${theme}`);
    }

    function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function clearAllData() {
      if (confirm('すべてのタスクと履歴を削除しますか？')) {
        localStorage.clear();
        location.reload();
      }
    }

    function escapeHtml(str) {
      return str.replace(/[&< me"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }
  </script>
</body>
</html>
